name: Flutter CI

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Test on Linux
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - name: Flutter action
        uses: subosito/flutter-action@v2.21.0
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: CLI smoke test (dart entrypoint)
        run: |
          dart run bin/export_markdown.dart --input examples/straza/id-40086785_date-19091112_vol-01_no-132_middle.json --output build/ci_cli_smoke.md --no-images
          test -f build/ci_cli_smoke.md
      - name: Remove WASM dependencies
        run: dart run pdfrx:remove_wasm_modules
  
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor == 'nektos/act' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v6
      - name: Flutter action
        uses: subosito/flutter-action@v2.21.0
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Remove WASM dependencies
        run: dart run pdfrx:remove_wasm_modules
      - name: Build Windows Release
        run: flutter build windows --release
      - name: CLI smoke test (windows binary)
        shell: pwsh
        run: |
          ./test/windows_cli_smoke.ps1
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v6
        with:
          name: veritium-windows-release
          path: build/windows/x64/runner/Release

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      
      - name: Download Windows Release Artifact
        uses: actions/download-artifact@v8
        with:
          name: veritium-windows-release
          path: dist

      - name: Zip Windows Release
        run: |
          cd dist
          zip -r ../veritium-windows-release.zip .

      - name: Zip Sample
        run: |
          cd examples/straza
          zip -r ../../sample.zip .

      - name: Prepare release notes
        id: release_notes
        run: |
          TAG="${{ github.ref_name }}"
          DATE="$(date -u +%Y-%m-%d)"
          awk -v tag="$TAG" 'BEGIN{flag=0} $0 ~ ("^##[[:space:]]+Release[[:space:]]+"tag) {flag=1; next} /^##[[:space:]]+/{if(flag) exit} flag{print}' CHANGELOG.md > release_notes.md || true
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT || true
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.body }}
          draft: false
          prerelease: false
          files: |
            veritium-windows-release.zip
            sample.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
